<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LED制御</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #f4f4f4;
      margin: 0;
      padding: 30px;
    }

    .led-box {
      width: 280px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 10px;
    }

    a {
      display: inline-block;
      margin: 5px;
      padding: 10px 25px;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    .on {
      background: #28a745;
    }

    .off {
      background: #dc3545;
    }
  </style>
</head>
<body>
  <h1>LED制御</h1>

  <div class="led-box">
    <h2>LED1：{{ led1 }}</h2>
    <a class="on" href="/led1/on">ON</a>
    <a class="off" href="/led1/off">OFF</a>
  </div>

  <div class="led-box">
    <h2>LED2：{{ led2 }}</h2>
    <a class="on" href="/led2/on">ON</a>
    <a class="off" href="/led2/off">OFF</a>
  </div>
</body>
</html>
